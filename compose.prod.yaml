# Perfil de producción del ensayo: un solo origen HTTPS.
#
# No es un override de `compose.yaml` a propósito. Aquel deja la API publicada
# y la web por HTTP porque es el que usa el ensayo cómodo; este cambia la
# topología —la API deja de estar publicada y nginx hace de proxy— y mezclarlos
# daría un archivo difícil de leer. Se levanta solo con `-f compose.prod.yaml`.
#
#   scripts/comicteca-tls
#   scripts/comicteca-sesion
#   docker compose -f compose.prod.yaml up -d --build
#
# Sin `mkcert -install` el navegador pedirá confirmar el certificado; la prueba
# de cabeceras lo acepta con NODE_EXTRA_CA_CERTS.
name: comicteca-prod

services:
  api:
    build:
      context: .
      dockerfile: src/Comicteca.Api/Dockerfile
      secrets:
        - github_token
    environment:
      ConnectionStrings__Comicteca: "Data Source=/data/comicteca.db"
      Datos__RutaCsv: "/app/data/coleccion.csv"
      # Sin CORS: la web llega por el proxy de nginx, así que es el mismo
      # origen. Abrir una lista aquí sería permiso que nadie usa.
      Autenticacion__Authority: "${AUTENTICACION_AUTHORITY:?falta AUTENTICACION_AUTHORITY}"
      Autenticacion__Audience: "${AUTENTICACION_AUDIENCE:?falta AUTENTICACION_AUDIENCE}"
      Autenticacion__CuentaPermitida: "${AUTENTICACION_CUENTA_PERMITIDA:?falta AUTENTICACION_CUENTA_PERMITIDA}"
    volumes:
      - datos:/data
    # Sin `ports`: la API solo existe en la red de Compose. El único camino
    # desde el host es https://comicteca.localhost:5443/api.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: src/Comicteca.Web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    configs:
      - source: sesion_web
        target: /usr/share/nginx/html/appsettings.Production.json
        mode: 0444
    volumes:
      # La configuración de nginx y el certificado se montan desde el host: la
      # imagen es la misma que la del ensayo y no se reconstruye por esto.
      - ./docker/site.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/cabeceras.prod.conf:/etc/nginx/snippets/cabeceras.conf:ro
      - ./.tls:/etc/nginx/tls:ro
    ports:
      # IPv4 e IPv6: `comicteca.localhost` resuelve a ::1 en esta máquina, así
      # que publicar solo en 127.0.0.1 dejaría el nombre sin respuesta.
      - "127.0.0.1:5080:8080"
      - "[::1]:5080:8080"
      - "127.0.0.1:5443:8443"
      - "[::1]:5443:8443"
    restart: unless-stopped
    healthcheck:
      # El certificado lo firma la CA del host y no está dentro de la imagen:
      # el chequeo no valida la cadena, solo que nginx responde.
      test: ["CMD", "wget", "-q", "--no-check-certificate", "--spider", "https://127.0.0.1:8443/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  datos:

configs:
  sesion_web:
    file: ${SESION_WEB_ARCHIVO:-./.sesion/appsettings.Production.json}

secrets:
  github_token:
    environment: GH_PACKAGES_TOKEN
