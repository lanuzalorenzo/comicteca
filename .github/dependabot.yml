version: 2

registries:
  github-packages:
    type: nuget-feed
    url: https://nuget.pkg.github.com/lanuzalorenzo/index.json
    username: lanuzalorenzo
    password: ${{secrets.LL_PACKAGES_TOKEN}}

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    registries: "*"
    schedule:
      interval: "weekly"
      day: "monday"
    # Una versión retirada a los dos días no llega a entrar.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
    # La familia de plataforma sigue al TargetFramework. Un mayor es una
    # migración (core/docs/versiones-y-dependencias.md), no una actualización.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "Microsoft.Extensions.*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "Microsoft.Data.Sqlite"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "Microsoft.Authentication.WebAssembly.Msal"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "Microsoft.JSInterop"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "System.Security.Cryptography.Pkcs"
        update-types:
          - "version-update:semver-major"
    groups:
      nuget-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      nuget-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "npm"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    # Una versión retirada a los dos días no llega a entrar.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      npm-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Una versión retirada a los dos días no llega a entrar.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
