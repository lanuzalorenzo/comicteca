name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilación, formato y pruebas (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Compilar, verificar el formato y probar
        uses: lanuzalorenzo/core/actions/dotnet@v1.4
        with:
          solution: Comicteca.slnx

  links:
    name: Enlaces de la documentación
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Comprobar enlaces y anclas
        uses: lanuzalorenzo/core/actions/check-links@v1.4
        with:
          root: .
          skip: src/Comicteca.Web/wwwroot,src/Comicteca.Web/obj

  secret-scanning:
    name: Detección de secretos (historial completo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Escanear secretos con Gitleaks
        uses: lanuzalorenzo/core/actions/gitleaks@v1.4

  sca:
    name: Dependencias vulnerables (NuGet)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar con auditoría (directas y transitivas)
        run: dotnet restore Comicteca.slnx

      - name: Informe de dependencias vulnerables
        run: dotnet list Comicteca.slnx package --vulnerable --include-transitive

  sast:
    name: Análisis estático (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Analizar con CodeQL y publicar el SARIF
        uses: lanuzalorenzo/core/actions/sast@v1.6
        with:
          languages: csharp

  container-scan:
    name: Imágenes de contenedor (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Revisar la base musl de los Dockerfiles
        uses: lanuzalorenzo/core/actions/check-sshd-baseline@v1.6
        with:
          root: .

      - name: Construir la imagen de la API
        run: docker build --secret id=github_token,env=GH_PACKAGES_TOKEN --tag comicteca-api:ci --file src/Comicteca.Api/Dockerfile .

      - name: Construir la imagen de la web
        run: docker build --tag comicteca-web:ci --file src/Comicteca.Web/Dockerfile .

      - name: Comprobar que la web no corre como root
        run: |
          uid="$(docker run --rm --entrypoint id comicteca-web:ci -u)"
          echo "uid de la web: $uid"
          test "$uid" != "0"

      - name: Escanear la imagen de la API
        uses: lanuzalorenzo/core/actions/scan@v1.6
        with:
          scan-type: image
          image-ref: comicteca-api:ci
          category: trivy-api

      - name: Escanear la imagen de la web
        uses: lanuzalorenzo/core/actions/scan@v1.6
        with:
          scan-type: image
          image-ref: comicteca-web:ci
          category: trivy-web

  web-e2e:
    name: Interfaz en navegador (375 px)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias .NET
        run: dotnet restore Comicteca.slnx

      - name: Compilar en Release
        run: dotnet build Comicteca.slnx -c Release --no-restore -warnaserror

      - name: Auditar dependencias de la prueba
        run: npm audit --audit-level=high
        working-directory: tests/e2e

      - name: Arrancar los servicios y probar la interfaz
        uses: lanuzalorenzo/core/actions/browser-e2e@v1.5
        with:
          working-directory: tests/e2e
          start-script: tests/e2e/start.sh
          wait-urls: http://localhost:5094/health, http://localhost:5077/

      - name: Subir la captura y los registros si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            tests/e2e/artifacts
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log
          if-no-files-found: ignore
