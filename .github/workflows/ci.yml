name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilación, formato y pruebas (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Compilar, verificar el formato y probar
        uses: lanuzalorenzo/core/actions/dotnet@v1.3
        with:
          solution: Comicteca.slnx

  links:
    name: Enlaces de la documentación
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Comprobar enlaces y anclas
        uses: lanuzalorenzo/core/actions/check-links@v1.3
        with:
          root: .
          skip: src/Comicteca.Web/wwwroot,src/Comicteca.Web/obj

  secret-scanning:
    name: Detección de secretos (historial completo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Escanear secretos con Gitleaks
        uses: lanuzalorenzo/core/actions/gitleaks@v1.4

  sca:
    name: Dependencias vulnerables (NuGet)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar con auditoría (directas y transitivas)
        run: dotnet restore Comicteca.slnx

      - name: Informe de dependencias vulnerables
        run: dotnet list Comicteca.slnx package --vulnerable --include-transitive

  web-e2e:
    name: Interfaz en navegador (375 px)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias .NET
        run: dotnet restore Comicteca.slnx

      - name: Compilar en Release
        run: dotnet build Comicteca.slnx -c Release --no-restore -warnaserror

      - name: Auditar dependencias de la prueba
        run: npm audit --audit-level=high
        working-directory: tests/e2e

      - name: Arrancar los servicios y probar la interfaz
        uses: lanuzalorenzo/core/actions/browser-e2e@v1.5
        with:
          working-directory: tests/e2e
          start-script: tests/e2e/start.sh
          wait-urls: http://localhost:5094/health, http://localhost:5077/

      - name: Subir la captura y los registros si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            tests/e2e/artifacts
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log
          if-no-files-found: ignore
