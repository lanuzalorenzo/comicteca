name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilación, formato y pruebas (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore Comicteca.slnx

      - name: Compilar en Release con analizadores
        run: dotnet build Comicteca.slnx -c Release --no-restore -warnaserror

      - name: Verificar formato
        run: dotnet format Comicteca.slnx --verify-no-changes --no-restore

      - name: Ejecutar pruebas
        run: >
          dotnet test Comicteca.slnx
          -c Release --no-build --no-restore
          --logger "trx;LogFileName=test-results.trx"

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore

  secret-scanning:
    name: Detección de secretos (historial completo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Escanear secretos con Gitleaks
        run: gitleaks detect --source . --redact --verbose --exit-code 2

  sca:
    name: Dependencias vulnerables (NuGet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar con auditoría (directas y transitivas)
        run: dotnet restore Comicteca.slnx

      - name: Informe de dependencias vulnerables
        run: dotnet list Comicteca.slnx package --vulnerable --include-transitive

  web-e2e:
    name: Interfaz en navegador (375 px)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Restaurar dependencias .NET
        run: dotnet restore Comicteca.slnx

      - name: Compilar en Release
        run: dotnet build Comicteca.slnx -c Release --no-restore -warnaserror

      - name: Instalar dependencias de la prueba
        run: npm ci
        working-directory: tests/e2e

      - name: Auditar dependencias de la prueba
        run: npm audit --audit-level=high
        working-directory: tests/e2e

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Arrancar la API y la web, y probar la interfaz
        run: |
          set -euo pipefail
          export ConnectionStrings__Comicteca="Data Source=$RUNNER_TEMP/comicteca-e2e.db"
          export Datos__RutaCsv="$GITHUB_WORKSPACE/data/coleccion.csv"
          ASPNETCORE_URLS=http://localhost:5094 dotnet run --project src/Comicteca.Api -c Release --no-build --no-launch-profile > "$RUNNER_TEMP/api.log" 2>&1 &
          ASPNETCORE_URLS=http://localhost:5077 dotnet run --project src/Comicteca.Web -c Release --no-build --no-launch-profile > "$RUNNER_TEMP/web.log" 2>&1 &
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5094/health >/dev/null && curl -sf http://localhost:5077/ >/dev/null; then
              npm test --prefix tests/e2e
              exit 0
            fi
            sleep 1
          done
          echo "La API o la web no arrancaron a tiempo"
          cat "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log"
          exit 1

      - name: Subir la captura y los registros si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            tests/e2e/artifacts
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log
          if-no-files-found: ignore
