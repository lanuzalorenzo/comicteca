name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilación, formato y pruebas (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore Comicteca.slnx

      - name: Compilar en Release con analizadores
        run: dotnet build Comicteca.slnx -c Release --no-restore -warnaserror

      - name: Verificar formato
        run: dotnet format Comicteca.slnx --verify-no-changes --no-restore

      - name: Ejecutar pruebas
        run: >
          dotnet test Comicteca.slnx
          -c Release --no-build --no-restore
          --logger "trx;LogFileName=test-results.trx"

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore

  secret-scanning:
    name: Detección de secretos (historial completo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Escanear secretos con Gitleaks
        run: gitleaks detect --source . --redact --verbose --exit-code 2

  sca:
    name: Dependencias vulnerables (NuGet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar con auditoría (directas y transitivas)
        run: >
          dotnet restore Comicteca.slnx
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:WarningsAsErrors="NU1901;NU1902;NU1903;NU1904"

      - name: Informe de dependencias vulnerables
        run: dotnet list Comicteca.slnx package --vulnerable --include-transitive
