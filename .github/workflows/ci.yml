name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilación, formato y pruebas (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Comprobar la versión de plataforma
        uses: lanuzalorenzo/core/actions/check-platform@v1.8

      - name: Compilar, verificar el formato y probar
        uses: lanuzalorenzo/core/actions/dotnet@v1.6
        with:
          solution: Comicteca.slnx

      # La web publicada no lleva valores en el repositorio: se escriben al
      # publicar (ADR 0007). Se comprueban las cuatro caras, porque un cambio en
      # el .csproj puede dejarlas en verde sin que nadie mire.
      - name: Comprobar los valores de sesión del publish
        run: |
          EMPTY="$RUNNER_TEMP/publicada-vacia/wwwroot/appsettings.Production.json"
          dotnet publish src/Comicteca.Web/Comicteca.Web.csproj -c Release --no-restore \
            -o "$RUNNER_TEMP/publicada-vacia"
          test "$(cat "$EMPTY")" = "{ }" \
            || { echo "Sin valores debería publicarse vacío" >&2; exit 1; }

          CON="$RUNNER_TEMP/publicada-con/wwwroot/appsettings.Production.json"
          Autenticacion__Authority="https://login.example.test/v2.0" \
          Autenticacion__ClientId="00000000-0000-0000-0000-000000000000" \
          Autenticacion__ApiScope="api://comicteca-api/acceso" \
            dotnet publish src/Comicteca.Web/Comicteca.Web.csproj -c Release --no-restore \
              -o "$RUNNER_TEMP/publicada-con"
          for esperado in "login.example.test" "00000000-0000-0000-0000-000000000000" "api://comicteca-api/acceso"; do
            grep -q "$esperado" "$CON" \
              || { echo "No llegó al archivo publicado: $esperado" >&2; exit 1; }
            gzip -dc "$CON.gz" | grep -q "$esperado" \
              || { echo "No llegó a la variante comprimida: $esperado" >&2; exit 1; }
          done

          # Falta un valor: el publish tiene que detenerse, y por ese motivo.
          if Autenticacion__Authority="https://login.example.test/v2.0" \
             dotnet publish src/Comicteca.Web/Comicteca.Web.csproj -c Release --no-restore \
               -o "$RUNNER_TEMP/publicada-falta" >"$RUNNER_TEMP/falta.log" 2>&1; then
            echo "El publish debía detenerse sin ClientId ni ApiScope" >&2
            exit 1
          fi
          grep -q "Falta Autenticacion__ClientId" "$RUNNER_TEMP/falta.log" \
            || { echo "El publish falló, pero no por el valor que falta" >&2; cat "$RUNNER_TEMP/falta.log"; exit 1; }

          # Un despliegue no se publica sin valores: tiene que fallar también sin
          # ninguno, no solo con uno a medias.
          if dotnet publish src/Comicteca.Web/Comicteca.Web.csproj -c Release --no-restore \
               -p:ExigirSesion=true -o "$RUNNER_TEMP/publicada-exigida" >"$RUNNER_TEMP/exigida.log" 2>&1; then
            echo "ExigirSesion=true debía detener un publish sin valores" >&2
            exit 1
          fi
          grep -q "ExigirSesion=true y no hay valores de sesión" "$RUNNER_TEMP/exigida.log" \
            || { echo "El publish exigido falló, pero no por la ausencia de valores" >&2; cat "$RUNNER_TEMP/exigida.log"; exit 1; }

  links:
    name: Enlaces de la documentación
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Comprobar enlaces y anclas
        uses: lanuzalorenzo/core/actions/check-links@v1.6
        with:
          root: .
          skip: src/Comicteca.Web/wwwroot,src/Comicteca.Web/obj

  secret-scanning:
    name: Detección de secretos (historial completo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Escanear secretos con Gitleaks
        uses: lanuzalorenzo/core/actions/gitleaks@v1.6

  sca:
    name: Dependencias vulnerables (NuGet)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar con auditoría (directas y transitivas)
        run: dotnet restore Comicteca.slnx

      - name: Informe de dependencias vulnerables
        run: dotnet list Comicteca.slnx package --vulnerable --include-transitive

      - name: Informe de paquetes desactualizados
        run: dotnet list Comicteca.slnx package --outdated
        continue-on-error: true

  sast:
    name: Análisis estático (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Analizar con CodeQL y publicar el SARIF
        uses: lanuzalorenzo/core/actions/sast@v1.6
        with:
          languages: csharp

  container-scan:
    name: Imágenes de contenedor (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Revisar la base musl de los Dockerfiles
        uses: lanuzalorenzo/core/actions/check-sshd-baseline@v1.6
        with:
          root: .

      - name: Construir la imagen de la API
        run: docker build --secret id=github_token,env=GH_PACKAGES_TOKEN --tag comicteca-api:ci --file src/Comicteca.Api/Dockerfile .

      - name: Construir la imagen de la web
        run: docker build --tag comicteca-web:ci --file src/Comicteca.Web/Dockerfile .

      - name: Comprobar que la web no corre como root
        run: |
          uid="$(docker run --rm --entrypoint id comicteca-web:ci -u)"
          echo "uid de la web: $uid"
          test "$uid" != "0"

      # Trivy mira el sistema de archivos, no arranca nginx: un paquete subido
      # en la misma capa podría romper el módulo que enlaza. Esta prueba carga
      # la configuración con el usuario final de la imagen.
      - name: Comprobar que la configuración de nginx sigue válida
        run: docker run --rm comicteca-web:ci nginx -t

      - name: Escanear la imagen de la API
        uses: lanuzalorenzo/core/actions/scan@v1.6
        with:
          scan-type: image
          image-ref: comicteca-api:ci
          category: trivy-api

      - name: Escanear la imagen de la web
        uses: lanuzalorenzo/core/actions/scan@v1.6
        with:
          scan-type: image
          image-ref: comicteca-web:ci
          category: trivy-web

  web-e2e:
    name: Interfaz en navegador (375 px)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias .NET
        run: dotnet restore Comicteca.slnx

      - name: Compilar en Release
        run: dotnet build Comicteca.slnx -c Release --no-restore -warnaserror

      - name: Auditar dependencias de la prueba
        run: npm audit --audit-level=high
        working-directory: tests/e2e

      - name: Arrancar los servicios y probar la interfaz
        uses: lanuzalorenzo/core/actions/browser-e2e@v1.6
        with:
          working-directory: tests/e2e
          start-script: tests/e2e/start.sh
          wait-urls: http://localhost:5094/health, http://localhost:5077/

      - name: Subir la captura y los registros si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            tests/e2e/artifacts
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log
          if-no-files-found: ignore
