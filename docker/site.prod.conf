# nginx del perfil de producción: un solo origen HTTPS.
#
# La web y la API comparten origen. nginx sirve los archivos de Blazor y pasa
# `/api/` y `/health` a la API por la red interna de Compose, de modo que el
# navegador nunca habla con la API directamente: no hay CORS que abrir y la CSP
# puede quedarse en `connect-src 'self'`.
#
# El puerto del host va escrito aquí a propósito: sin variables de plantilla,
# un `return 301` con `$host` perdería el 5443 y mandaría al 443. Este perfil es
# de un solo nombre de host, y lo es `comicteca.localhost`.

server {
    # HTTP no sirve nada: solo redirige. Cubre el primer acceso y a los clientes
    # que no aplican HSTS.
    #
    # Límite conocido: HSTS reescribe la URL conservando el puerto (RFC 6797
    # §8.3), así que un navegador que lo tenga aprendido para este host pedirá
    # https://comicteca.localhost:5080, donde no hay TLS, y el 301 no llega. En
    # un despliegue real el par es 80→443 y el caso no existe; aquí los puertos
    # son altos para que nginx corra sin privilegios. En la práctica el ensayo es
    # usable porque Chromium no aplica HSTS a `*.localhost`; no está comprobado en
    # otros navegadores.
    listen 8080;
    server_name _;

    return 301 https://comicteca.localhost:5443$request_uri;
}

server {
    # Puerto alto: nginx arranca sin privilegios (USER nginx en el Dockerfile).
    listen 8443 ssl;
    http2 on;
    server_name comicteca.localhost;

    # mkcert emite el par para este host; `.tls/` se monta en solo lectura y no
    # se versiona. El certificado es de desarrollo, no de un despliegue real.
    ssl_certificate     /etc/nginx/tls/comicteca.localhost.pem;
    ssl_certificate_key /etc/nginx/tls/comicteca.localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # La API responde con sus propias cabeceras (LL.Security), así que aquí solo
    # se añade HSTS: el navegador lo aprende una vez y cubre todas las rutas.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Strict-Transport-Security "max-age=63072000" always;
    }

    location /health {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Strict-Transport-Security "max-age=63072000" always;
    }

    location / {
        include /etc/nginx/snippets/cabeceras.conf;
        # Blazor publica el importmap como script en línea y su contenido
        # cambia con las huellas de cada compilación: se le pone un nonce por
        # petición ($request_id) que la CSP admite.
        sub_filter '<script type="importmap">' '<script type="importmap" nonce="$request_id">';
        sub_filter_once on;
        try_files $uri $uri/ /index.html;
    }

    location /_framework/ {
        include /etc/nginx/snippets/cabeceras.conf;
        try_files $uri =404;
        # Cualquier `add_header` de esta location descarta los heredados del
        # servidor, por eso el include de arriba repite las cabeceras.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
