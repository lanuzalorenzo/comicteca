# Cabeceras de seguridad de la web. Se incluyen en cada location porque
# cualquier `add_header` propio de una location descarta las del servidor.
# `always` las emite también en respuestas de error.
#
# La CSP tiene que admitir Blazor WebAssembly (`wasm-unsafe-eval` en
# script-src) y MSAL (`login.microsoftonline.com` en connect-src y
# frame-src). `frame-ancestors 'self'` y `X-Frame-Options: SAMEORIGIN` no son
# un descuido: MSAL renueva el token en silencio con un iframe que vuelve a la
# propia página. `connect-src` lleva el origen de la API: en local es
# http://localhost:5094. Al desplegar (fase 2 del plan) hay que cambiarlo por
# el origen real; hasta entonces esta lista es la del ensayo local.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'nonce-$request_id'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:5094 https://login.microsoftonline.com; frame-src 'self' https://login.microsoftonline.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; manifest-src 'self'" always;
