server {
    # Puerto alto para que nginx escuche sin privilegios después del `USER`.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        include /etc/nginx/snippets/cabeceras.conf;
        # Blazor publica el importmap como script en línea y su contenido
        # cambia con las huellas de cada compilación, así que no vale un hash
        # fijo: se le pone un nonce por petición ($request_id) que la CSP
        # admite. El resto de scripts son externos y los cubre 'self'.
        sub_filter '<script type="importmap">' '<script type="importmap" nonce="$request_id">';
        sub_filter_once on;
        try_files $uri $uri/ /index.html;
    }

    location /_framework/ {
        include /etc/nginx/snippets/cabeceras.conf;
        try_files $uri =404;
        # Cualquier `add_header` de esta location descarta los heredados del
        # servidor, por eso el include de arriba repite las cabeceras.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
