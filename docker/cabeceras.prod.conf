# Cabeceras de seguridad del perfil de producción. Se incluyen en cada location
# porque cualquier `add_header` propio de una location descarta las del servidor.
# `always` las emite también en respuestas de error.
#
# Diferencias con `docker/cabeceras.conf`, que sigue siendo la del ensayo local:
# - HSTS: el perfil de producción solo se sirve por HTTPS, y el navegador debe
#   recordarlo. `includeSubDomains` se omite a propósito: no hay subdominios y
#   no se promete lo que no se ha probado.
# - `connect-src` no lleva el origen de la API: en este perfil nginx sirve la
#   web y hace de proxy de `/api`, así que la API es el mismo origen y basta
#   con `'self'`. La CSP del ensayo local sí lo nombra porque allí son dos
#   puertos distintos.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=63072000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'nonce-$request_id'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://login.microsoftonline.com; frame-src 'self' https://login.microsoftonline.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; manifest-src 'self'" always;
